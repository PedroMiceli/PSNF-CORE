spring.application.name=psnf-api

spring.datasource.url=jdbc:postgresql://localhost:5432/psnf
spring.datasource.username=postgres
spring.datasource.password=opentech
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Habilita o virtual threads
spring.threads.virtual.enabled=true

spring.elasticsearch.uris=http://localhost:9200

# Evita N+1 ao carregar as coleções (itens, valores, imagens, endereços...)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# As conversões para o domínio acontecem dentro das transações dos use cases
spring.jpa.open-in-view=false
