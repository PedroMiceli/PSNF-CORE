spring.application.name=psnf-api

spring.datasource.url=jdbc:postgresql://localhost:5432/psnf
spring.datasource.username=postgres
spring.datasource.password=opentech
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP). O padrão é 10: com virtual threads, milhares de requisições podem chegar
# juntas e todas disputam essas conexões. 30 por instância cabe no max_connections=100 padrão do PostgreSQL
# com 3 instâncias (acima disso, PgBouncer na frente do banco). Quem não consegue conexão em 5 s recebe
# erro rápido, em vez de ficar 30 s pendurado (o padrão).
spring.datasource.hikari.maximum-pool-size=${PSNF_DB_POOL:30}
spring.datasource.hikari.minimum-idle=${PSNF_DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=5000
# avisa no log se uma conexão ficar presa mais de 20 s (vazamento)
spring.datasource.hikari.leak-detection-threshold=20000

# O esquema do banco é do Flyway (db/migration); o Hibernate só confere se as entidades batem com ele
# e recusa iniciar se faltar tabela/coluna. Mudou uma entidade? Crie a migração V<n>__....sql.
spring.jpa.hibernate.ddl-auto=validate
# Imprime cada SQL no console: útil para depurar, caro com carga (escrita síncrona por consulta).
# Desligado por padrão; para ligar: PSNF_SHOW_SQL=true
spring.jpa.show-sql=${PSNF_SHOW_SQL:false}

#Habilita o virtual threads
spring.threads.virtual.enabled=true



# Evita N+1 ao carregar as coleções (itens, valores, imagens, endereços...)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# As conversões para o domínio acontecem dentro das transações dos use cases
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------------------------
# Upload de arquivos (imagens até 5 MB e PDF/XML até 10 MB são validados no domínio)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Object storage S3-compatível. Padrão: MinIO do docker-compose.
# Para usar o AWS S3: deixe psnf.storage.endpoint vazio, path-style=false, ajuste a region e
# remova access-key/secret-key para usar as credenciais padrão da AWS.
psnf.storage.endpoint=${PSNF_STORAGE_ENDPOINT:http://localhost:9000}
psnf.storage.region=${PSNF_STORAGE_REGION:us-east-1}
psnf.storage.access-key=${PSNF_STORAGE_ACCESS_KEY:minioadmin}
psnf.storage.secret-key=${PSNF_STORAGE_SECRET_KEY:minioadmin}
psnf.storage.bucket=${PSNF_STORAGE_BUCKET:psnf-arquivos}
psnf.storage.path-style=${PSNF_STORAGE_PATH_STYLE:true}

# ---------------------------------------------------------------------------------------------
# Migrações do banco (Flyway): src/main/resources/db/migration, aplicadas na inicialização.
#  V<n>__descricao.sql -> roda uma única vez, em ordem (V1 = esquema que existia antes do Flyway)
#  R__descricao.sql    -> repetível: roda de novo quando o arquivo muda (ex.: categorias fixas)
# baseline-on-migrate: banco que já existia sem o Flyway é marcado como V1 em vez de recriado.
# Com várias instâncias subindo juntas, o Flyway usa uma trava no banco: só uma aplica as migrações.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# nunca apagar o banco por engano (flyway clean)
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------------------------
# Consulta de endereço por CEP (BrasilAPI CEP v2)
psnf.cep.brasilapi-url=https://brasilapi.com.br/api/cep/v2
psnf.cep.timeout=5s
psnf.ncm.brasilapi-url=https://brasilapi.com.br/api/ncm/v1
psnf.ncm.timeout=8s

# ---------------------------------------------------------------------------------------------
# Autenticação: JWT em cookie HttpOnly (access, 15 min) + refresh token rotativo guardado no banco.
# PSNF_JWT_SECRET: pelo menos 32 caracteres, igual em todas as instâncias, fora do git. Vazio = chave
# aleatória a cada início (só desenvolvimento). Gere uma com: openssl rand -base64 48
psnf.auth.jwt-segredo=${PSNF_JWT_SECRET:}
psnf.auth.access-validade=${PSNF_ACCESS_VALIDADE:15m}
psnf.auth.refresh-validade=${PSNF_REFRESH_VALIDADE:30d}
# Secure: cookies só em HTTPS (navegadores aceitam também em http://localhost)
psnf.auth.cookie-seguro=${PSNF_COOKIE_SECURE:true}
# Path do cookie de refresh como o NAVEGADOR vê a rota (o front chama a API em /api/...)
psnf.auth.caminho-refresh=${PSNF_REFRESH_PATH:/api/auth}
# Senha errada para o mesmo e-mail: 5 seguidas são toleradas; depois, 1 tentativa a cada 5 minutos
# (vale igual para e-mail cadastrado ou não, para não revelar quem tem conta). Senha certa zera.
psnf.auth.login-falhas=${PSNF_LOGIN_FALHAS:5}
psnf.auth.login-intervalo-minutos=${PSNF_LOGIN_INTERVALO_MIN:5}
# Endereço do front, usado nos links dos e-mails (confirmar e-mail, redefinir senha)
psnf.app.url-front=${PSNF_FRONT_URL:http://localhost:5173}

# E-mail. Com PSNF_SMTP_HOST definido, envia por SMTP (SES, SendGrid, Mailgun...); sem ele, as mensagens
# vão só para o log e para GET /dev/emails (desenvolvimento).
spring.mail.host=${PSNF_SMTP_HOST:}
spring.mail.port=${PSNF_SMTP_PORT:587}
spring.mail.username=${PSNF_SMTP_USER:}
spring.mail.password=${PSNF_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${PSNF_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${PSNF_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
psnf.email.remetente=${PSNF_EMAIL_REMETENTE:PSNF <nao-responda@psnf.com.br>}
# caixa de e-mails de desenvolvimento (GET /dev/emails): segue a chave dos usuários de teste
psnf.email.caixa-dev=${PSNF_USUARIOS_TESTE:true}

# Usuários de teste (vendedor@mock.psnf e comprador@mock.psnf, senha 123456) e caixa de e-mails de
# desenvolvimento. DESLIGUE em produção (PSNF_USUARIOS_TESTE=false).
psnf.mock.usuarios.enabled=${PSNF_USUARIOS_TESTE:true}

# ---------------------------------------------------------------------------------------------
# Rate limit (token bucket em memória por instância). Vale para TODAS as rotas.
# Chave: o usuário logado (id do JWT); sem login (login, cadastro, renovação), o IP.
# capacidade = rajada máxima; por-minuto = ritmo sustentado. Acima disso: HTTP 429 com Retry-After.
# Um usuário com o chat aberto faz ~25 req/min; abrir uma página faz uma rajada de 5 a 15.
psnf.rate-limit.habilitado=${PSNF_RATE_LIMIT_ENABLED:true}
psnf.rate-limit.padrao.capacidade=${PSNF_RATE_LIMIT_CAPACIDADE:100}
psnf.rate-limit.padrao.por-minuto=${PSNF_RATE_LIMIT_POR_MINUTO:300}
# Exceções (a primeira que casar vale; cada uma tem balde próprio e não gasta o padrão):
# imagens passam pela API e uma vitrine carrega dezenas de uma vez (depois ficam em cache por 30 dias)
psnf.rate-limit.regras[0].nome=imagens
psnf.rate-limit.regras[0].metodo=GET
psnf.rate-limit.regras[0].caminhos=/arquivos/**
psnf.rate-limit.regras[0].capacidade=300
psnf.rate-limit.regras[0].por-minuto=1200
# upload grava no storage: limite baixo contra enchimento do bucket
psnf.rate-limit.regras[1].nome=upload
psnf.rate-limit.regras[1].metodo=POST
psnf.rate-limit.regras[1].caminhos=/arquivos/**
psnf.rate-limit.regras[1].capacidade=20
psnf.rate-limit.regras[1].por-minuto=30
# cadastro de usuário: evita criação de contas em massa
psnf.rate-limit.regras[2].nome=cadastro
psnf.rate-limit.regras[2].metodo=POST
psnf.rate-limit.regras[2].caminhos=/usuarios
psnf.rate-limit.regras[2].capacidade=5
psnf.rate-limit.regras[2].por-minuto=10
# CEP e NCM consultam a BrasilAPI: protege a nossa cota no serviço externo
psnf.rate-limit.regras[3].nome=consultas-externas
psnf.rate-limit.regras[3].metodo=GET
psnf.rate-limit.regras[3].caminhos=/cep/**,/ncm/**
psnf.rate-limit.regras[3].capacidade=30
psnf.rate-limit.regras[3].por-minuto=60
# login (por IP): contra quem testa muitos e-mails (credential stuffing). A tentativa por e-mail tem
# um freio próprio: psnf.auth.login-falhas / login-intervalo-minutos.
psnf.rate-limit.regras[4].nome=login
psnf.rate-limit.regras[4].metodo=POST
psnf.rate-limit.regras[4].caminhos=/auth/login,/auth/token
psnf.rate-limit.regras[4].capacidade=10
psnf.rate-limit.regras[4].por-minuto=10
# pedidos que disparam e-mail (por IP): não usar a API para mandar spam a terceiros
psnf.rate-limit.regras[5].nome=emails-conta
psnf.rate-limit.regras[5].metodo=POST
psnf.rate-limit.regras[5].caminhos=/auth/esqueci-senha,/auth/reenviar-confirmacao
psnf.rate-limit.regras[5].capacidade=5
psnf.rate-limit.regras[5].por-minuto=5
# Atrás de load balancer/proxy reverso, use "native" (ou "framework") para o rate limit enxergar o IP
# real do cliente (X-Forwarded-For). Sem proxy, mantenha "none": senão o cliente forja o próprio IP.
server.forward-headers-strategy=${PSNF_FORWARD_HEADERS:none}
