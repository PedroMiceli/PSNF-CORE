<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Visão geral da arquitetura">
<title>Visão geral da arquitetura</title>
<defs><marker id="pf475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="pi475569" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="1198" height="888" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#111827">Visão geral da arquitetura</text><text x="28" y="60" font-size="13" fill="#4B5563">Um cluster Kubernetes de 3 nós no seu servidor; cada nó hospeda uma cópia de cada peça importante.</text>
<rect x="40" y="85" width="250" height="70" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="1.6"/>
<text x="165.0" y="117.0" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">E-mail (SMTP) e BrasilAPI</text>
<text x="165.0" y="134.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">serviços externos</text>
<rect x="500" y="85" width="200" height="60" rx="10" fill="#F3F4F6" stroke="#9AA3AF" stroke-width="1.6"/>
<text x="600.0" y="112.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Usuários</text>
<text x="600.0" y="129.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">internet</text>
<rect x="910" y="85" width="250" height="70" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="1.6"/>
<text x="1035.0" y="117.0" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">S3 (nuvem)</text>
<text x="1035.0" y="134.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">arquivos e backups</text>
<rect x="470" y="185" width="260" height="60" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="600.0" y="212.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">Roteador / firewall</text>
<text x="600.0" y="229.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">só as portas 80 e 443 entram</text>
<rect x="40" y="280" width="1120" height="585" rx="14" fill="#F3F4F6" fill-opacity="0.45" stroke="#9AA3AF" stroke-width="1.5"/>
<text x="56" y="304" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Rede local do servidor</text>
<rect x="450" y="300" width="300" height="60" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="600.0" y="327.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">IP virtual (load balancer)</text>
<text x="600.0" y="344.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">muda de nó sozinho se um cair</text>
