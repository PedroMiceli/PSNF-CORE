<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rede: como um acesso chega até a aplicação">
<title>Rede: como um acesso chega até a aplicação</title>
<defs><marker id="pf475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="pi475569" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="1198" height="558" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#111827">Rede: como um acesso chega até a aplicação</text><text x="28" y="60" font-size="13" fill="#4B5563">Só o gateway é alcançável de fora. Todo o resto fica na rede local.</text>
<rect x="30" y="90" width="250" height="300" rx="14" fill="#F3F4F6" fill-opacity="0.45" stroke="#9AA3AF" stroke-width="1.5"/>
<text x="46" y="114" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Internet</text>
<rect x="310" y="90" width="220" height="300" rx="14" fill="#F1EAFE" fill-opacity="0.45" stroke="#7B4FD6" stroke-width="1.5"/>
<text x="326" y="114" font-size="13" font-weight="700" fill="#3B1F7A" text-anchor="start">Borda</text>
<rect x="560" y="90" width="610" height="300" rx="14" fill="#E8F1FE" fill-opacity="0.45" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="576" y="114" font-size="13" font-weight="700" fill="#12366F" text-anchor="start">Rede local do servidor</text>
<rect x="55" y="135" width="200" height="70" rx="10" fill="#F3F4F6" stroke="#9AA3AF" stroke-width="1.6"/>
<text x="155.0" y="167.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Usuário</text>
<text x="155.0" y="184.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">navegador</text>
<rect x="55" y="280" width="200" height="80" rx="10" fill="#F3F4F6" stroke="#9AA3AF" stroke-width="1.6"/>
<text x="155.0" y="309.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">DNS</text>
<text x="155.0" y="326.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">psnf.seudominio.com.br</text>
<text x="155.0" y="343.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">aponta para o IP público</text>
<rect x="330" y="195" width="180" height="90" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="420.0" y="229.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">Roteador / firewall</text>
<text x="420.0" y="246.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">IP público</text>
<text x="420.0" y="263.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">repassa 80 e 443</text>
<rect x="585" y="195" width="170" height="90" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="670.0" y="229.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">IP virtual</text>
<text x="670.0" y="246.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">um endereço,</text>
<text x="670.0" y="263.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">três nós por trás</text>
<rect x="795" y="195" width="160" height="90" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="875.0" y="229.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">Gateway</text>
<text x="875.0" y="246.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">3 réplicas</text>
<text x="875.0" y="263.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">HTTPS termina aqui</text>
<rect x="1000" y="135" width="150" height="70" rx="10" fill="#E8F1FE" stroke="#2F6FDE" stroke-width="1.6"/>
<text x="1075.0" y="167.0" font-size="14" font-weight="700" fill="#12366F" text-anchor="middle">Front</text>
<text x="1075.0" y="184.0" font-size="12" font-weight="400" fill="#12366F" text-anchor="middle">site estático</text>
<rect x="1000" y="280" width="150" height="70" rx="10" fill="#E8F1FE" stroke="#2F6FDE" stroke-width="1.6"/>
<text x="1075.0" y="312.0" font-size="14" font-weight="700" fill="#12366F" text-anchor="middle">API</text>
<text x="1075.0" y="329.0" font-size="12" font-weight="400" fill="#12366F" text-anchor="middle">chamadas /api</text>
<path d="M155,280 L155,205" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#pf475569)"/>
<text x="155" y="248" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">descobre o endereço</text>
<path d="M255,170 L290,170 L290,240 L330,240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="305" y="150" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">HTTPS</text>
<path d="M510,240 L585,240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<path d="M755,240 L795,240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<path d="M955,220 L975,220 L975,170 L1000,170" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<path d="M955,260 L975,260 L975,315 L1000,315" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<rect x="560" y="410" width="610" height="120" rx="14" fill="#F3F4F6" fill-opacity="0.45" stroke="#9AA3AF" stroke-width="1.5"/>
<text x="576" y="434" font-size="13" font-weight="700" fill="#1F2937" text-anchor="start">Administração</text>
<rect x="585" y="448" width="250" height="62" rx="10" fill="#F3F4F6" stroke="#9AA3AF" stroke-width="1.6"/>
<text x="710.0" y="476.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Você (kubectl, SSH)</text>
<text x="710.0" y="493.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">pela rede local ou por VPN</text>
<rect x="890" y="448" width="255" height="62" rx="10" fill="#F1EAFE" stroke="#7B4FD6" stroke-width="1.6"/>
<text x="1017.5" y="476.0" font-size="14" font-weight="700" fill="#3B1F7A" text-anchor="middle">Controle do Kubernetes</text>
<text x="1017.5" y="493.0" font-size="12" font-weight="400" fill="#3B1F7A" text-anchor="middle">nunca exposto à internet</text>
<path d="M835,479 L890,479" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<rect x="30" y="420" width="500" height="72" rx="8" fill="#FFF9DB" stroke="#D4A72C" stroke-width="1.2"/>
<text x="44" y="443" font-size="12.5" font-weight="400" fill="#5C4400" text-anchor="start">O certificado HTTPS é emitido e renovado sozinho</text>
<text x="44" y="461" font-size="12.5" font-weight="400" fill="#5C4400" text-anchor="start">(Let's Encrypt). Exige a porta 80 aberta e o DNS</text>
<text x="44" y="479" font-size="12.5" font-weight="400" fill="#5C4400" text-anchor="start">apontando para o seu IP público.</text>
</svg>
