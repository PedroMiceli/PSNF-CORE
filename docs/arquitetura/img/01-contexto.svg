<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Contexto: quem fala com quem">
<title>Contexto: quem fala com quem</title>
<defs><marker id="pf475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="pi475569" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="1198" height="558" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
<text x="28" y="38" font-size="19" font-weight="700" fill="#111827">Contexto: quem fala com quem</text><text x="28" y="60" font-size="13" fill="#4B5563">Tudo roda no seu servidor. Só os arquivos (S3) ficam na nuvem.</text>
<rect x="40" y="235" width="210" height="90" rx="10" fill="#F3F4F6" stroke="#9AA3AF" stroke-width="1.6"/>
<text x="145.0" y="269.0" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Compradores e vendedores</text>
<text x="145.0" y="286.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">navegador, no computador</text>
<text x="145.0" y="303.0" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">ou no celular</text>
<rect x="340" y="95" width="500" height="380" rx="14" fill="#E8F1FE" fill-opacity="0.45" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="356" y="119" font-size="13" font-weight="700" fill="#12366F" text-anchor="start">Seu servidor (local)</text>
<rect x="420" y="215" width="340" height="130" rx="10" fill="#E8F1FE" stroke="#2F6FDE" stroke-width="1.6"/>
<text x="590.0" y="269.0" font-size="17" font-weight="700" fill="#12366F" text-anchor="middle">Plataforma PSNF</text>
<text x="590.0" y="286.0" font-size="12" font-weight="400" fill="#12366F" text-anchor="middle">site + API + banco de dados + Redis</text>
<text x="590.0" y="303.0" font-size="12" font-weight="400" fill="#12366F" text-anchor="middle">em Kubernetes, com 3 nós</text>
<rect x="930" y="105" width="230" height="90" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="1.6"/>
<text x="1045.0" y="139.0" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">S3 (nuvem)</text>
<text x="1045.0" y="156.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">fotos, notas fiscais, comprovantes</text>
<text x="1045.0" y="173.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">e cópias de segurança do banco</text>
<rect x="930" y="235" width="230" height="90" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="1.6"/>
<text x="1045.0" y="269.0" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">Serviço de e-mail (SMTP)</text>
<text x="1045.0" y="286.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">confirmação de conta</text>
<text x="1045.0" y="303.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">e redefinição de senha</text>
<rect x="930" y="365" width="230" height="90" rx="10" fill="#FFF1E0" stroke="#E08A1E" stroke-width="1.6"/>
<text x="1045.0" y="399.0" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">BrasilAPI</text>
<text x="1045.0" y="416.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">consulta de CEP, CNPJ</text>
<text x="1045.0" y="433.0" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">e NCM</text>
<path d="M250,280 L420,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="335.0" y="273.0" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">HTTPS</text>
<path d="M760,250 L880,250 L880,150 L930,150" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="880" y="140" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">arquivos</text>
<path d="M760,280 L930,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="845.0" y="273.0" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">e-mails</text>
<path d="M760,310 L880,310 L880,410 L930,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="880" y="432" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">consultas</text>
<rect x="340" y="495" width="820" height="36" rx="8" fill="#FFF9DB" stroke="#D4A72C" stroke-width="1.2"/>
<text x="354" y="518" font-size="12.5" font-weight="400" fill="#5C4400" text-anchor="start">S3 é a única nuvem escolhida. E-mail e BrasilAPI são serviços externos que a aplicação já usa hoje.</text>
</svg>
