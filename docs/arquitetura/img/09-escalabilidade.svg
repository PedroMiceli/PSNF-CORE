<text x="92" y="538" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Gateway, front, Redis</text>
<rect x="440" y="526" width="14" height="14" rx="2" fill="#D1D5DB" stroke="#64748B"/>
<text x="462" y="538" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">Monitoramento</text>
