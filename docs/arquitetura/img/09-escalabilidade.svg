<rect x="571.5625" y="425" width="50.15625" height="46" rx="3" fill="#A5B4FC" stroke="#64748B"/>
<text x="596.640625" y="453" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">1,5 GB</text>
<rect x="621.71875" y="425" width="100.3125" height="46" rx="3" fill="#D1D5DB" stroke="#64748B"/>
<text x="671.875" y="453" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">3 GB</text>
<rect x="722.03125" y="425" width="417.96875" height="46" rx="3" fill="#F3F4F6" stroke="#64748B"/>
<text x="931.015625" y="453" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">12,5 GB</text>
