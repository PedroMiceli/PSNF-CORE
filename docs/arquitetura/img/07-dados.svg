<text x="390.0" y="199.5" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Primário</text>
<text x="390.0" y="216.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">nó 1</text>
<text x="390.0" y="233.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">lê e grava</text>
<path d="M495,161 a75.0,11 0 0 1 150,0 v88 a75.0,11 0 0 1 -150,0 z" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="1.6"/>
