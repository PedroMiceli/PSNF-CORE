<text x="1060.0" y="226.5" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">fotos, NF, comprovantes</text>
<text x="1060.0" y="243.5" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">bucket privado</text>
