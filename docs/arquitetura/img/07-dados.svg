<text x="1060.0" y="459.5" font-size="14" font-weight="700" fill="#7A4504" text-anchor="middle">S3 (nuvem)</text>
<text x="1060.0" y="476.5" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">cópias de segurança</text>
<text x="1060.0" y="493.5" font-size="12" font-weight="400" fill="#7A4504" text-anchor="middle">do banco</text>
