<text x="570.0" y="216.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">nó 2</text>
<text x="570.0" y="233.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">cópia em tempo real</text>
<path d="M675,161 a75.0,11 0 0 1 150,0 v88 a75.0,11 0 0 1 -150,0 z" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="1.6"/>
<path d="M675,161 a75.0,11 0 0 0 150,0" fill="none" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="750.0" y="199.5" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Réplica</text>
<text x="750.0" y="216.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">nó 3</text>
<text x="750.0" y="233.5" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">cópia em tempo real</text>
<path d="M465,205 L495,205" fill="none" stroke="#2E9E5B" stroke-width="1.8" marker-end="url(#pf2E9E5B)"/>
<path d="M645,205 L675,205" fill="none" stroke="#2E9E5B" stroke-width="1.8" marker-end="url(#pf2E9E5B)"/>
<text x="570" y="300" font-size="13" font-weight="600" fill="#14532D" text-anchor="middle">Se o primário cair, uma réplica assume sozinha em segundos.</text>
<text x="570" y="322" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="middle">A API sempre fala com "o primário atual", sem saber em que nó ele está.</text>
<path d="M210,205 L315,205" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#pf475569)"/>
<text x="262" y="196" font-size="12" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">dados</text>
<rect x="290" y="395" width="560" height="150" rx="14" fill="#E6F6EC" fill-opacity="0.45" stroke="#2E9E5B" stroke-width="1.5"/>
<text x="306" y="419" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Redis: uma instância, sem disco</text>
<rect x="315" y="440" width="200" height="80" rx="10" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="415.0" y="469.0" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Redis</text>
<text x="415.0" y="486.0" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">contadores do rate limit</text>
<text x="415.0" y="503.0" font-size="12" font-weight="400" fill="#14532D" text-anchor="middle">e das tentativas de senha</text>
<text x="690" y="470" font-size="13" font-weight="600" fill="#14532D" text-anchor="middle">Não guarda nada que faça falta.</text>
<text x="690" y="492" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="middle">Se cair, a API conta na memória</text>
<text x="690" y="510" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="middle">até ele voltar em outro nó.</text>
