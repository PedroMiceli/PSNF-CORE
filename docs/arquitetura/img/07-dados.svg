<text x="125.0" y="219.0" font-size="12" font-weight="400" fill="#12366F" text-anchor="middle">3 a 6 pods</text>
<rect x="290" y="95" width="560" height="270" rx="14" fill="#E6F6EC" fill-opacity="0.45" stroke="#2E9E5B" stroke-width="1.5"/>
<text x="306" y="119" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">PostgreSQL: três cópias, uma em cada nó</text>
<path d="M315,161 a75.0,11 0 0 1 150,0 v88 a75.0,11 0 0 1 -150,0 z" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="1.6"/>
