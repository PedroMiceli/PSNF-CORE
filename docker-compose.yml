version: '3.8'
services:
  # Object storage S3-compatível para os uploads (imagens, NF...).
  # API S3: http://localhost:9000 | Console web: http://localhost:9001 (minioadmin / minioadmin)
  # A MinIO Inc. removeu a imagem "minio/minio" do Docker Hub; usamos o "pgsty/minio" (Silo),
  # fork comunitário mantido do mesmo servidor MinIO: mesmo comando, variáveis e portas.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: psnf-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Redis: baldes do rate limit e do freio de tentativas de login, compartilhados entre as instâncias da API.
  # Sem persistência em disco: se reiniciar, os baldes voltam cheios (ninguém fica bloqueado por engano).
  redis:
    image: redis:7-alpine
    container_name: psnf-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

volumes:
  miniodata: